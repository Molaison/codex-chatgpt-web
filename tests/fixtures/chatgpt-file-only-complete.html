<!-- Minimized, de-identified native file-only answer. Resource cards are siblings
     of the answer Markdown; their filename and hover controls are not prose. -->
<section id="turn" data-turn-key="fixture-current">
  <div data-content-search-unit-key="fixture:1:assistant">
    <h4 class="sr-only" data-conversation-role="assistant">Assistant</h4>
    <div>
      <div data-markdown-text-style="assistant-message"><div><button aria-label="查看分析"></button></div></div>
      <div class="resource-card">
        <span class="group/resource-row">
          <button type="button" aria-label="Open report.csv preview" aria-busy="false"></button>
          <span><span title="report.csv">report.csv</span><span>Spreadsheet</span></span>
          <span class="hover-download" style="opacity:0"><button type="button" aria-label="下载文件"></button></span>
        </span>
      </div>
    </div>
  </div>
  <button type="button" data-testid="copy-turn-action-button"></button>
</section>
