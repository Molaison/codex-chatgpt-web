<div id="turn" data-turn-key="synthetic-c3-error-shape">
  <div>
    <div data-content-search-unit-key="fixture:0:user">
      <h4 data-conversation-role="user">You said:</h4>
      <div data-user-message-bubble><p>Continue the check.</p></div>
      <div class="turn-action-controls">
        <button aria-label="复制消息"></button>
        <button aria-label="共享提示"></button>
        <button aria-label="编辑消息"></button>
      </div>
    </div>
    <div id="activity">
      <span hidden data-chatgpt-agent-turn-start></span>
      <div>
        <div data-markdown-text-style="assistant-message"><p>Continuing the check.</p></div>
        <div data-markdown-text-style="assistant-message"><p>I will inspect the configuration.</p></div>
      </div>
    </div>
    <div id="failure">
      <div role="alert">
        <p id="error-text">生成回答时出错，请重试。</p>
        <button type="button" aria-label="重试">重试</button>
      </div>
    </div>
  </div>
</div>
